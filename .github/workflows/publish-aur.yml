# Publishes the AUR package when a release is cut.
#
# The AUR holds only a build recipe, not a build: users' machines compile from the
# tag this workflow points them at. So "cutting AUR" is just bumping _tag/pkgver in
# the PKGBUILD, regenerating .SRCINFO, and pushing those two files to the AUR's own
# git repo -- there is no artifact to upload and nothing to attach to the release.
#
# Runs on release publication, alongside the AppImage, so the AUR never lags the
# other channels. The Flatpak stays monthly (see build-flatpak.yml) because it is
# slow and self-updates; the AUR is cheap here because no compilation happens.
#
# Requires one repository secret:
#   AUR_SSH_PRIVATE_KEY -- a private key whose public half is registered on the
#                          AUR account that owns the package.
name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.4.0.5366-alpha)'
        required: true
      dry_run:
        description: 'Build and validate, but do not push to the AUR'
        type: boolean
        default: false
      rebuild:
        description: 'Same release, rebuilt: raise pkgrel above the AUR''s and keep the launcher pin (after an Arch library update, see aur-library-watch.yml)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The bump to PKGBUILD/.SRCINFO is committed back to this repository, and the
    # default token is read-only for `release` events. Without this the whole job
    # fails at the push with "Permission to ... denied to github-actions[bot]",
    # after having done all the work -- which is how v1.4.0.5397-alpha shipped
    # with the recipe still pinned to the previous release.
    permissions:
      contents: write
    # makepkg --printsrcinfo is the only supported way to generate .SRCINFO, and it
    # only exists on Arch, so the whole job runs in an Arch container.
    container: archlinux:base-devel

    steps:
      - name: Resolve the tag being published
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          [ -n "$TAG" ] || { echo "::error::no tag to publish"; exit 1; }

          # The AUR is a STABLE-only channel.
          #
          # This fires on every published release, and an alpha tag used to be
          # published here with its suffix stripped -- v1.4.0.5397-alpha became
          # pkgver 1.4.0.5397. pacman upgrades on version alone, so `yay -Syu`
          # moved Arch users onto alpha builds silently, indistinguishably from
          # stable, every few days. The launcher has a release-channel setting to
          # prevent exactly that; a distro package has no equivalent, so the
          # filtering has to happen here.
          #
          # Deliberately not skipped quietly: a release that does not reach the
          # AUR should say so in the log, or the next person debugging "why is the
          # AUR behind?" has nothing to go on.
          case "$TAG" in
            *-alpha|*-prototype)
              echo "::notice::$TAG is an alpha/prototype tag; the AUR tracks stable releases only, so there is nothing to publish."
              echo "skip_channel=1" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          PKGVER="${TAG#v}"
          case "$PKGVER" in
            *[!0-9.]*) echo "::error::tag '$TAG' does not yield a numeric pkgver ('$PKGVER')"; exit 1 ;;
          esac
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG as pkgver $PKGVER"

      - name: Install tooling
        if: steps.tag.outputs.skip_channel != '1'
        run: pacman -Syu --noconfirm --needed git openssh curl

      - uses: actions/checkout@v4

      - name: Bump the PKGBUILD to this release
        if: steps.tag.outputs.skip_channel != '1'
        working-directory: packaging/aur
        run: |
          # One split package builds both outputs, so there is a single version to
          # bump and engine/data cannot drift apart.
          current_pkgver=$(sed -n 's|^pkgver=||p' PKGBUILD)
          sed -i "s|^_tag=.*|_tag=${{ steps.tag.outputs.tag }}|" PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${{ steps.tag.outputs.pkgver }}|" PKGBUILD
          # pkgrel resets to 1 for a NEW version: a release is always a fresh build.
          # A republish of the SAME version must NOT reset it. That happens when the
          # packaging changes without the engine -- shipping a pacman hook ahead of
          # the release that needs it, for instance, which has to be done because
          # pacman reads hooks at transaction start and a hook shipped in the
          # breaking upgrade never runs for it. Against a live -4, a -1 is a
          # downgrade: pacman would not offer it and the change would silently
          # never reach anyone.
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            # A rebuild is the release that is already out, offered again so every
            # machine compiles it against the libraries Arch has now: after a soname
            # bump pacman refuses the library upgrade until that happens. Only pkgrel
            # moves, and it has to go above what the AUR has, not above whatever the
            # recipe on this branch says.
            [ "$current_pkgver" = "${{ steps.tag.outputs.pkgver }}" ] || {
              echo "::error::rebuild republishes the release this branch's recipe carries ($current_pkgver), not ${{ steps.tag.outputs.pkgver }}: run it from the stable's branch"; exit 1; }
            live=$(curl -fsS --max-time 20 'https://aur.archlinux.org/rpc/v5/info?arg[]=keeperfx-tux' \
              | grep -o '"Version":"[^"]*"' | head -n1 | sed 's/.*:"\(.*\)"/\1/')
            [ "${live%-*}" = "$current_pkgver" ] || {
              echo "::error::the AUR has '${live:-nothing}', not $current_pkgver: a rebuild is for the version that is live"; exit 1; }
            sed -i "s|^pkgrel=.*|pkgrel=$(( ${live##*-} + 1 ))|" PKGBUILD
            echo "::notice::Rebuild of $current_pkgver: pkgrel ${live##*-} -> $(( ${live##*-} + 1 ))"
          elif [ "$current_pkgver" != "${{ steps.tag.outputs.pkgver }}" ]; then
            sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          else
            echo "::notice::Republishing ${current_pkgver}; keeping pkgrel=$(sed -n 's|^pkgrel=||p' PKGBUILD) rather than resetting to 1"
          fi
          # The launcher is pinned by commit and has to move with the engine: the
          # AppImage for this same release is built from the launcher's alpha
          # branch, so the Arch package pins that branch's head. Left alone, the
          # pin stayed at the previous stable's launcher -- v1.4.0.5652 went out
          # that way, with an engine a month newer than its launcher. A rebuild
          # keeps the pin it went out with: it is the same release.
          L=$(git ls-remote https://github.com/ForkedInTime/keeperfx-launcher-qt-linux.git refs/heads/alpha | cut -f1)
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "keeping _launcher_commit=$(sed -n 's|^_launcher_commit=||p' PKGBUILD)"
          elif [ -n "$L" ]; then
            sed -i "s|^_launcher_commit=.*|_launcher_commit=$L|" PKGBUILD
          else
            echo "::warning::could not resolve the launcher's alpha head; keeping the committed _launcher_commit"
          fi
          grep -E '^(_tag|pkgver|pkgrel|_launcher_commit)=' PKGBUILD

      - name: Recompute the data archive checksum
        if: steps.tag.outputs.skip_channel != '1'
        id: sums
        working-directory: packaging/aur
        run: |
          # The data package pins the release asset by hash, so the hash has to be
          # recomputed for each release. Downloaded once, here, rather than trusting
          # a value copied by hand.
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/keeperfx-linux-alpha-x86_64-full.7z"
          # The data package pins this archive by hash, but it is attached to the
          # release by the AppImage build, which runs after the release is published.
          # On a fresh release it is therefore legitimately not there yet.
          if ! curl -fsSL --retry 3 -o /tmp/full.7z "$URL"; then
            # A rebuild is of a release that has been out for weeks: its archive is
            # there, so a failed download is a failure, not a reason to skip.
            if [ "${{ inputs.rebuild }}" = "true" ]; then
              echo "::error::could not download $URL for the rebuild; nothing was published"
              exit 1
            fi
            echo "::notice::$URL is not attached yet — re-run this workflow once the AppImage build has uploaded it"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUM=$(sha256sum /tmp/full.7z | cut -d' ' -f1)
          echo "full.7z sha256 = $SUM"
          # The archive is the second source entry, so replace the second hash.
          python3 - "$SUM" <<'EOF'
          import re, sys
          s = open('PKGBUILD').read()
          head, rest = s.split("sha256sums=(\n", 1)
          body, tail = rest.split(")\n", 1)
          parts = [l.strip() for l in body.strip().split("\n")]
          parts[1] = "'" + sys.argv[1] + "'"
          open('PKGBUILD','w').write(head + "sha256sums=(\n" + "\n".join("  "+p for p in parts) + "\n)\n" + tail)
          EOF
          grep -A5 '^sha256sums' PKGBUILD
          rm -f /tmp/full.7z

          # The three files packaged alongside the archive (the wrapper scripts and
          # the desktop entry) are pinned by hash too, and nothing was recomputing
          # them: editing one and forgetting its hash publishes a recipe that fails
          # `makepkg` for everyone, with the release itself looking perfectly fine.
          # That is exactly what shipped with v1.4.0.5411 -- the launcher wrapper had
          # been changed that morning. Recompute them from the files being published.
          python3 - <<'EOF'
          import hashlib, re
          s = open('PKGBUILD').read()
          # source entries that are plain filenames (no "::" URL form) are local files
          src_block = s.split("source=(\n", 1)[1].split(")\n", 1)[0]
          names = [l.strip().strip("'\"") for l in src_block.strip().split("\n")]
          head, rest = s.split("sha256sums=(\n", 1)
          body, tail = rest.split(")\n", 1)
          sums = [l.strip() for l in body.strip().split("\n")]
          for i, n in enumerate(names):
              if "::" in n or "/" in n or n.startswith("$"):
                  continue          # remote source or VCS entry: SKIP or handled above
              digest = hashlib.sha256(open(n, 'rb').read()).hexdigest()
              if sums[i].strip("'\"") != digest:
                  print(f"re-pinning {n}: {sums[i]} -> {digest}")
                  sums[i] = "'" + digest + "'"
          open('PKGBUILD', 'w').write(
              head + "sha256sums=(\n" + "\n".join("  " + p for p in sums) + "\n)\n" + tail)
          EOF
          grep -A7 '^sha256sums' PKGBUILD

      - name: Verify the tag actually exists upstream
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          # Catches a release published before its tag propagated, which would
          # otherwise ship a PKGBUILD nobody can build.
          git ls-remote --exit-code --tags \
            https://github.com/${{ github.repository }}.git \
            "refs/tags/${{ steps.tag.outputs.tag }}"

      - name: Regenerate .SRCINFO
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          # makepkg refuses to run as root, so do this as a normal user.
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          chown root .SRCINFO
          head -6 .SRCINFO

      - name: Sanity-check the generated metadata
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        working-directory: packaging/aur
        run: |
          grep -q "pkgver = ${{ steps.tag.outputs.pkgver }}" .SRCINFO \
            || { echo "::error::.SRCINFO pkgver does not match the release"; exit 1; }
          grep -q "${{ steps.tag.outputs.tag }}" .SRCINFO \
            || { echo "::error::.SRCINFO does not reference the release tag"; exit 1; }
          # Both outputs must still be declared, or users lose one silently.
          for n in keeperfx-tux keeperfx-tux-data; do
            grep -q "^pkgname = $n\$" .SRCINFO \
              || { echo "::error::.SRCINFO no longer declares $n"; exit 1; }
          done
          echo "split package at ${{ steps.tag.outputs.tag }} declares both outputs"

      # Everything the AUR receives is fixed here, from the tag's files plus the
      # bump above, and checked: the checksums were computed from these exact
      # files, so this is the one copy that matches them. The steps after this
      # (recording the bump on the default branch, which rebases onto whatever
      # landed there since the tag) must not be able to change what is
      # published -- they used to: the AUR got the default branch's files after
      # that rebase, with the tag's checksums, so a wrapper edited on alpha after
      # tagging shipped with a stale hash and `makepkg` failed for everyone.
      - name: Stage the AUR build context
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1'
        run: |
          STAGE=/tmp/aur-stage
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # Every local file named in the PKGBUILD's source=() has to land in the
          # AUR repository -- that repository IS the build context, so one file
          # missing means the package fails to build for everyone who installs it.
          for f in PKGBUILD .SRCINFO keeperfx-tux.sh keeperfx-tux.desktop \
                   keeperfx-tux-launcher.sh keeperfx-tux.hook keeperfx-tux-libcheck.sh \
                   keeperfx-tux-stash.sh keeperfx-tux-stash.hook \
                   keeperfx-tux-unstash.hook keeperfx-tux-previous.sh \
                   keeperfx-tux-system-curl.patch; do
            [ -f "packaging/aur/$f" ] \
              || { echo "::error::packaging/aur/$f is missing; the AUR build context would be incomplete"; exit 1; }
            cp "packaging/aur/$f" "$STAGE/"
          done
          # The list above is maintained by hand and has already been wrong once,
          # so check it against the PKGBUILD itself -- and check every local
          # file's checksum against sha256sums=(), here, where a mismatch can be
          # reported, instead of in every user's failing build.
          python3 - "$STAGE" <<'EOF'
          import hashlib, os, sys
          stage = sys.argv[1]
          s = open(os.path.join(stage, 'PKGBUILD')).read()
          names = [l.strip().strip("'\"") for l in s.split("source=(\n", 1)[1].split(")\n", 1)[0].strip().split("\n")]
          sums = [l.strip().strip("'\"") for l in s.split("sha256sums=(\n", 1)[1].split(")\n", 1)[0].strip().split("\n")]
          bad = 0
          for name, want in zip(names, sums):
              if "::" in name or "/" in name or name.startswith("$"):
                  continue
              path = os.path.join(stage, name)
              if not os.path.isfile(path):
                  print(f"::error::{name} is in the PKGBUILD's source=() but not staged; add it to the list in this step")
                  bad = 1
                  continue
              got = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              if want != "SKIP" and got != want:
                  print(f"::error::{name}: checksum {got} does not match the PKGBUILD's {want}")
                  bad = 1
          sys.exit(bad)
          EOF
          ls -la "$STAGE"

      - name: Commit the bump back to this repo
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1' && !inputs.dry_run
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Record the bump on the branch this release belongs to, not always
          # on the default branch. A stable is cut from its own branch
          # (hotfix/1.4.0.5660, stable): rebasing its bump onto alpha
          # conflicted, warned, and the bump was never recorded anywhere --
          # which is why alpha's recipe went on saying 1.4.0.5652 after
          # 1.4.0.5660 shipped. A run started by hand from a branch records it
          # there. A release (or a run on a tag) is checked out at the tag, so
          # take the branch whose head is that commit -- a release is tagged at
          # the head of its branch -- preferring the default branch when both
          # match, and fall back to the default branch with a warning.
          DEFAULT="${{ github.event.repository.default_branch }}"
          if [ "${{ github.ref_type }}" = "branch" ]; then
            TARGET="${{ github.ref_name }}"
          else
            HEADS="$(git ls-remote --heads origin | awk -v sha="$(git rev-parse HEAD)" '$1 == sha { sub("^refs/heads/", "", $2); print $2 }')"
            if printf '%s\n' "$HEADS" | grep -qx "$DEFAULT"; then
              TARGET="$DEFAULT"
            elif [ -n "$HEADS" ] && [ "$(printf '%s\n' "$HEADS" | wc -l)" -eq 1 ]; then
              TARGET="$HEADS"
            else
              TARGET="$DEFAULT"
              echo "::warning::no single branch has ${{ steps.tag.outputs.tag }} at its head (${HEADS:-none}); recording the bump on $DEFAULT"
            fi
          fi
          echo "recording the bump on $TARGET"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "PKGBUILDs already at this version; nothing to commit"
          else
            git commit -m "packaging: AUR package to ${{ steps.tag.outputs.tag }}"
            # Recording the bump here is bookkeeping; publishing to the AUR is the
            # job. This pushed straight at the default branch, so any commit that
            # landed there between the release and this step made the push fail --
            # which failed the step, and the AUR push is gated on it, so the
            # package silently never went out. Rebase once; if it still will not
            # go, say so and carry on to the AUR.
            # Rebase failures are handled, not hidden: `|| true` here used to leave a
            # conflicted rebase behind, after which the push was a silent no-op.
            # What reaches the AUR is already staged, so nothing below can change it.
            if git pull --rebase --autostash origin "$TARGET"; then
              git push origin "HEAD:refs/heads/$TARGET" \
                || echo "::warning::could not record the AUR bump on $TARGET; commit packaging/aur by hand"
            else
              git rebase --abort || true
              echo "::warning::the AUR bump conflicts with $TARGET; commit packaging/aur by hand (the AUR itself is unaffected)"
            fi
          fi

      - name: Push to the AUR
        id: aur
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1' && !inputs.dry_run
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set — add it in Settings > Secrets"
            exit 1
          fi
          # Everything ssh needs goes in one explicit directory, and ssh is told
          # about it by absolute path.
          #
          # Not ~/.ssh, and this is the whole reason the first real auto-publish
          # failed: in this container the shell's HOME is /github/home, but ssh
          # resolves ~ from the passwd entry and reads /root/.ssh. Files written to
          # one path were read from the other, so the key material was simply not
          # there -- "Host key verification failed", with a known_hosts sitting
          # perfectly well-formed in a directory ssh never looks at. Depending on
          # HOME agreeing with the passwd entry is the bug; not depending on it is
          # the fix.
          SSH_DIR=/tmp/aur-ssh
          rm -rf "$SSH_DIR" && mkdir -p "$SSH_DIR" && chmod 700 "$SSH_DIR"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/aur"
          chmod 600 "$SSH_DIR/aur"

          # The AUR host keys, pinned rather than fetched with ssh-keyscan. keyscan
          # is trust-on-first-use: it verifies nothing, it accepts whatever the
          # network hands back. The ed25519 fingerprint below is
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 -- the value published
          # on the Arch wiki, so a reader can check it rather than trust it. A key
          # rotation fails the publish loudly, which is correct.
          cat > "$SSH_DIR/known_hosts" <<'KNOWN_HOSTS'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          KNOWN_HOSTS
          # The heredoc is indented to match this YAML block; strip that leading
          # whitespace or ssh treats every line as malformed and ignores it.
          sed -i 's/^[[:space:]]*//' "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

          # Absolute paths, no ~ anywhere, so this cannot go wrong the same way again.
          export GIT_SSH_COMMAND="ssh -i $SSH_DIR/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=30"

          # Prove the credentials and the host key work before doing anything that
          # depends on them. The AUR always refuses an interactive shell, so a
          # successful handshake shows up as its "interactive shell is disabled"
          # message; anything else means the publish below cannot succeed.
          if ! $GIT_SSH_COMMAND -o BatchMode=yes aur@aur.archlinux.org 2>&1 | tee /tmp/sshcheck | grep -qi "interactive shell"; then
            cat /tmp/sshcheck
            echo "::error::cannot authenticate to the AUR; nothing was published"
            exit 1
          fi
          echo "AUR authentication OK"

          git config --global user.name  'KeeperFX Tux Edition CI'
          git config --global user.email 'noreply@users.noreply.github.com'

          # One AUR repository: the split package serves both outputs from it.
          if ! git clone ssh://aur@aur.archlinux.org/keeperfx-tux.git /tmp/aur 2>/tmp/aurerr; then
            cat /tmp/aurerr
            # Two states are expected rather than broken: the package has not been
            # imported yet (that first push has to be done by hand, CI only updates an
            # existing repo), and the AUR being in maintenance. Neither means this
            # release failed, so report and stop rather than failing the run.
            #
            # EVERYTHING ELSE MUST FAIL. This used to treat any non-maintenance error
            # as "not imported yet" and exit 0, so a host-key failure -- which is what
            # actually happened on the first real auto-publish -- produced a green run
            # that pushed nothing, while the package sat on the AUR the whole time.
            # A publish that does not publish has to be loud.
            if grep -qi 'maintenance' /tmp/aurerr; then
              echo "::notice::the AUR is in maintenance; skipping the AUR publish for this release"
              exit 0
            fi
            if grep -qiE 'does not exist|not found|no such repository' /tmp/aurerr; then
              echo "::notice::keeperfx-tux is not on the AUR yet; run packaging/aur/import-to-aur.sh once, then re-run this workflow"
              exit 0
            fi
            echo "::error::could not reach the AUR repository; nothing was published. See the git error above."
            exit 1
          fi
          # What the live AUR package is, before it is replaced: pacman and the
          # AUR helpers compare pkgver-pkgrel only, so a lower one is never
          # offered, and changed files under the SAME one are never offered
          # either -- both used to publish "successfully" and reach nobody.
          live="$(sed -n 's/^[[:space:]]*pkgver = //p' /tmp/aur/.SRCINFO | head -n1)-$(sed -n 's/^[[:space:]]*pkgrel = //p' /tmp/aur/.SRCINFO | head -n1)"
          new="$(sed -n 's/^[[:space:]]*pkgver = //p' /tmp/aur-stage/.SRCINFO | head -n1)-$(sed -n 's/^[[:space:]]*pkgrel = //p' /tmp/aur-stage/.SRCINFO | head -n1)"
          echo "live on the AUR: $live; this publish: $new"
          # The staged copy from the step above: exactly the files the
          # checksums were computed from.
          cp -a /tmp/aur-stage/. /tmp/aur/
          cd /tmp/aur
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already up to date"
            echo "expect=$new" >> "$GITHUB_OUTPUT"
          elif [ "$live" != "-" ] && [ "$(vercmp "$new" "$live")" -lt 0 ]; then
            echo "::error::$new is older than the live $live -- pacman would never offer it. The PKGBUILD's pkgrel has drifted behind the AUR; set it above the live one and re-run."
            exit 1
          elif [ "$live" != "-" ] && [ "$(vercmp "$new" "$live")" -eq 0 ] \
               && [ -z "$(git diff --cached --name-only -- . ':!PKGBUILD' ':!.SRCINFO')" ] \
               && ! git diff --cached -U0 -- PKGBUILD .SRCINFO | grep -E '^[-+][^-+]' \
                    | grep -vE '^[-+](_launcher_commit=|[[:space:]]*source = keeperfx-tux-launcher::)' | grep -q .; then
            # A re-run of a publish that already went out: the bump step re-pins
            # the launcher to its alpha head, which has moved on since. That
            # alone is not a change to publish -- this version is already the
            # AUR's -- so publish nothing and re-check that it is offered.
            echo "::notice::$new is already on the AUR; only the launcher pin moved since it was published, so nothing is republished"
            echo "expect=$new" >> "$GITHUB_OUTPUT"
          elif [ "$live" != "-" ] && [ "$(vercmp "$new" "$live")" -eq 0 ]; then
            git diff --cached --stat
            echo "::error::the package changed but its version did not ($new) -- nobody would be offered it. Bump pkgrel in packaging/aur/PKGBUILD and re-run."
            exit 1
          else
            # Read the rel back rather than assuming 1: a same-version republish
            # keeps the rel the recipe carries (see the bump step above).
            git commit -m "Update to ${{ steps.tag.outputs.pkgver }}-$(sed -n 's|^pkgrel=||p' PKGBUILD)"
            git push
            echo "expect=$new" >> "$GITHUB_OUTPUT"
          fi

      # The AUR's git repository has the new recipe the moment the push is
      # accepted, but the package information AUR helpers read -- what
      # `yay -Syu` asks -- can lag behind it by several minutes: 1.4.0.5660-2
      # was accepted at 00:12 UTC on 2026-10-11 and yay still saw -1 after
      # that. A green run should mean users are offered the update, so wait
      # for that, and fail loudly if it does not come. Skipped when nothing
      # was published (dry run, AUR in maintenance, package not imported).
      - name: Wait until the AUR offers it
        if: steps.aur.outputs.expect != ''
        env:
          WANT: ${{ steps.aur.outputs.expect }}
        run: |
          url='https://aur.archlinux.org/rpc/v5/info?arg[]=keeperfx-tux&arg[]=keeperfx-tux-data&arg[]=keeperfx-tux-launcher'
          got=
          for attempt in $(seq 1 30); do
            reply="$(curl -fsS --max-time 20 "$url" || true)"
            got="$(printf '%s' "$reply" | grep -o '"Version":"[^"]*"' | sort | uniq -c | tr -s ' \n' ' ')"
            # All three packages, each at the published version.
            if [ "$(printf '%s' "$reply" | grep -o "\"Version\":\"$WANT\"" | wc -l)" -eq 3 ]; then
              echo "the AUR offers $WANT for keeperfx-tux, -data and -launcher (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: the AUR reports ${got:-no answer}; waiting for $WANT"
            sleep 30
          done
          echo "::error::$WANT is in the AUR's git repository, but after 15 minutes its package information still reports ${got:-nothing}, so yay -Syu does not offer it yet. Check https://aur.archlinux.org/packages/keeperfx-tux; re-running this workflow re-checks without pushing again."
          exit 1

      - name: Dry-run summary
        if: steps.tag.outputs.skip_channel != '1' && steps.sums.outputs.skip != '1' && inputs.dry_run
        working-directory: packaging/aur
        run: |
          echo "Dry run — nothing pushed. Generated metadata:"
          cat .SRCINFO
