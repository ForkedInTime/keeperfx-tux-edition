# Builds the KeeperFX Tux Edition portable engine package (engine + fonts + config)
# on Ubuntu 24.04: glibc 2.39, so it runs on Ubuntu 24.04 and newer, Fedora, Arch and
# Steam Deck, not on older LTS releases. This runs on GitHub's servers; nothing is
# installed on your computer.
#
# Triggers:
#   * when you publish a Release  -> builds and attaches the package to it
#   * manually (Actions tab -> "Run workflow")
name: Build portable engine

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the build to the release

jobs:
  build-engine:
    runs-on: ubuntu-24.04     # ffmpeg 6.x (the engine needs ffmpeg >=5.1); glibc 2.39 -> runs on 24.04+ / Fedora / Arch / Steam Deck. The AppImage is built on 24.04 too, so older LTS releases need a source build.
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history, so the build number (git commit count) is correct

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 pkg-config gdb \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libopenal-dev libluajit-5.1-dev libspng-dev libminizip-dev zlib1g-dev \
            libminiupnpc-dev libnatpmp-dev libssl-dev libzstd-dev \
            $(packaging/ci/build-sdl3.sh --apt-packages)

      # Keyed on the script, which carries the pinned versions -- bumping SDL3
      # there invalidates this cache in the same commit.
      - name: Cache the SDL3 stack
        uses: actions/cache@v4
        with:
          path: deps/sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles('packaging/ci/build-sdl3.sh') }}

      - name: Build the SDL3 stack (ubuntu-24.04 ships no SDL3 packages)
        run: |
          packaging/ci/build-sdl3.sh
          eval "$(packaging/ci/build-sdl3.sh --env)"
          {
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "CPATH=$CPATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Fetch the auto-downloaded deps (serial, avoids a parallel-build race)
        run: |
          make -f linux.mk \
            deps/centijson/include/json.h deps/astronomy/include/astronomy.h \
            deps/enet6/include/enet6/enet.h deps/libcurl/lib/libcurl.a

      - name: Build the engine
        run: |
          # packaging/linux-only/build-number.sh keeps counting the team's commits now
          # that the sync merges filtered snapshots; a tag from before it falls back.
          BUILD_NUMBER="$(if [ -x packaging/linux-only/build-number.sh ]; then packaging/linux-only/build-number.sh; else git rev-list --count HEAD; fi)"
          echo "Build number: $BUILD_NUMBER"
          # Suffix derived from the tag -- see the same block in build-appimage.yml.
          # A stable tag must not stamp itself "alpha", or the launcher classifies
          # the release as an alpha and the stable channel means nothing.
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            *-alpha)     VER_SUFFIX=alpha ;;
            *-prototype) VER_SUFFIX=Prototype ;;
            v[0-9]*)     VER_SUFFIX= ;;
            *)           VER_SUFFIX=alpha ;;
          esac
          echo "Tag '$TAG' -> VER_SUFFIX='$VER_SUFFIX'"
          rm -f src/ver_defs.h
          make -f linux.mk BUILD_NUMBER="$BUILD_NUMBER" VER_SUFFIX="$VER_SUFFIX" -j"$(nproc)"
          # expose a filename-safe version string (e.g. 1.3.2.5182-alpha)
          VER="$(sed -n 's/.*VER_STRING  "\(.*\)".*/\1/p' src/ver_defs.h | tr ' ' '-')"
          echo "PKG_VER=$VER" >> "$GITHUB_ENV"

      # A saved game describes its own layout (upstream #5424): each field is
      # stored by name and read back by name, so a struct change only loses
      # saves if the format's tables change incompatibly -- or leave out a
      # member, which is then never saved. Run against the build that is about
      # to ship, before it is packaged. See packaging/ci/save-format-baseline.
      - name: Check the save format against the tracked baseline
        run: packaging/ci/check-save-format.sh

      # This edition sends nothing to the KeeperFX team's servers; a release
      # that would (an upstream default slipped back in) stops here.
      - name: Check nothing points at the KeeperFX team's servers
        run: packaging/ci/check-team-servers.sh

      - name: Generate the UTF-8 fonts (needed since upstream #4920)
        run: |
          packaging/ci/make-fonts.sh

      - name: Stage the portable engine package (engine + fonts + config + version)
        run: |
          S="dist/keeperfx-tux-edition"
          mkdir -p "$S/fxdata" "$S/creatrs" "$S/mods" "$S/music"
          cp bin/keeperfx "$S/keeperfx"
          sed -n 's/.*VER_STRING  "\(.*\)".*/\1/p' src/ver_defs.h > "$S/version.txt"
          cp tools/fxfontmaker/*.fxfont "$S/fxdata/"
          cp -r config/fxdata/. "$S/fxdata/"
          cp -r config/creatrs/. "$S/creatrs/"
          cp -r config/mods/.    "$S/mods/"
          # Our own MusicReadme: the upstream one still says OGG only, which has
          # not been true since the engine gained format and naming freedom.
          cp -r config/music/.   "$S/music/"
          tar -C dist -czf "keeperfx-tux-edition-${PKG_VER}-x86_64-portable.tar.gz" keeperfx-tux-edition
          ls -la keeperfx-tux-edition-*-portable.tar.gz

      - name: Upload the build (downloadable from this CI run)
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-tux-edition-portable
          path: keeperfx-tux-edition-*-x86_64-portable.tar.gz

      - name: Attach the build to the release (only when triggered by a release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: keeperfx-tux-edition-*-x86_64-portable.tar.gz

      # When the save format changed, players find out by loading a campaign and
      # not finding it. The release body is the one place they read before
      # updating, so say it there. Driven off the baseline file's history
      # between this release's tag and the previous one: a human accepting the
      # break edits that file, and this warning follows from the edit rather
      # than from anyone remembering to write it.
      #
      # Edits made with GITHUB_TOKEN do not trigger further workflow runs, so
      # rewriting the body here cannot loop back through the release triggers.
      - name: Warn in the release notes if earlier saves cannot be loaded
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, gh resolves to whatever repo it infers -- it has
          # answered for dkfans/keeperfx before now.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Newest release OF THE SAME CHANNEL that is not the one being
          # published. gh lists newest-first, so this is the version players on
          # this channel are updating FROM. The channel matters: a stable cut
          # right after an alpha would otherwise compare against that alpha and
          # report "unchanged" while stable players, coming from the previous
          # stable, lose every save.
          PRE=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          # gh's --jq takes only the expression, not jq's own --argjson, so the
          # flag is spliced in as a literal true/false (it is one or the other).
          PREV=$(gh release list --limit 100 --json tagName,isPrerelease \
                   --jq "[.[] | select(.tagName != \"$TAG\" and .isPrerelease == $PRE)] | first.tagName // empty")
          if [ -z "$PREV" ]; then
            echo "No earlier release to compare the save format against."
            exit 0
          fi
          echo "Comparing the save format with ${PREV}."
          git fetch --tags --force --quiet origin || true

          # Not `|| true`: a broken script must not look like "nothing to warn
          # about". Exit 3 is the one benign failure -- PREV predates the
          # baseline file, so the question is unanswerable, not answered "no".
          set +e
          NOTE=$(packaging/ci/check-save-format.sh --release-note "$PREV")
          RC=$?
          set -e
          if [ "$RC" -eq 3 ]; then
            echo "::notice::${PREV} predates the save-format guard; whether the format changed cannot be determined."
            exit 0
          elif [ "$RC" -ne 0 ]; then
            echo "::error::the save-format release note could not be produced (exit ${RC})."
            exit "$RC"
          fi
          if [ -z "$NOTE" ]; then
            echo "Save format unchanged since ${PREV}; existing saves keep working."
            exit 0
          fi

          BODY=$(gh release view "$TAG" --json body --jq .body)
          if printf '%s' "$BODY" | grep -qF '<!-- save-format-guard -->'; then
            echo "The release body already carries the warning; leaving it alone."
            exit 0
          fi

          printf '%s\n\n%s\n' "$NOTE" "$BODY" > release_body.md
          gh release edit "$TAG" --notes-file release_body.md
          echo "::warning title=Saves invalidated::${TAG} changed the save format; the release notes now warn that earlier saves cannot be loaded."
          echo "Prepended to the release notes:"
          cat release_body.md
