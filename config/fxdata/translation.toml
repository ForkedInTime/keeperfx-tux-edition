# Header line of the "are you sure" dialog for deleting a saved game
# (gui_delete_confirm_header_maintain in frontmenu_saves.c). Deleting a save
# moves it to the trash rather than erasing it outright, so this dialog gets
# its own wording instead of the shared "are you sure" text used elsewhere
# (e.g. quitting) -- this one is not a plain label, not a hover tooltip, so no
# header:detail colon here.
[SAVE_TRASH_CONFIRM]
ENG = "Move save to Trash?"

# Shown when a saved game will not load. The save format embeds a raw dump of
# the engine's game state, so a build that changes it cannot read older saves;
# that is a different thing from a damaged file, and the player can act on the
# difference (an old save is simply finished with, a damaged one may be worth
# investigating), so the two cases get their own wording.
# Both are message-box lines rather than hover tooltips, so no header:detail
# colon here -- see DELETE_SAVED_GAME above for the tooltip convention.
[SAVE_LOAD_FAILED_VERSION]
ENG = "Saved by another game version - play it with that version"
_CHI = "由其他游戏版本保存 - 请用该版本游玩"
